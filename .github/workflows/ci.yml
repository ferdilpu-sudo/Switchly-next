name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Switchly.sln

      - name: Format check
        run: dotnet format Switchly.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Switchly.sln -c Release --no-restore

      - name: Test
        run: dotnet test Switchly.sln -c Release --no-build
