name: Build CEF 156.0.30 (Proprietary Codecs win-x64)

on:
  workflow_dispatch:
    inputs:
      cef_branch:
        description: "CEF branch matching pinned CefSharp.Wpf.NETCore 156.0.300"
        required: true
        default: "8078"
      cef_checkout:
        description: "Exact CEF commit matching 156.0.30+g6028375+chromium-156.0.8078.96"
        required: true
        default: "6028375"
      runner_label:
        description: "Runner label (use self-hosted or a GitHub Larger Runner with >=150 GB free disk)"
        required: true
        default: "windows-latest"

jobs:
  build-cef-win64:
    # Note: Building Chromium/CEF from source requires >= 16 GB RAM and >= 150 GB free disk space.
    # Standard free windows-latest runners (~20 GB free) will run out of disk during Chromium checkout.
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 360

    env:
      GN_DEFINES: "is_official_build=true proprietary_codecs=true ffmpeg_branding=Chrome chrome_pgo_phase=0"
      GYP_MSVS_VERSION: "2022"
      CEF_ARCHIVE_FORMAT: "tar.bz2"

    steps:
      - name: Check available disk space & prepare workspace
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{N='FreeGB';E={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize
          $freeGb = (Get-PSDrive C).Free / 1GB
          if ($freeGb -lt 120) {
            Write-Warning "Free space on C: is $([math]::Round($freeGb,1)) GB. Chromium/CEF source builds typically require >= 150 GB free disk space."
          }
          New-Item -ItemType Directory -Force -Path "C:\cef-build\automate" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\cef-build\chromium_git" | Out-Null
          # Do NOT pre-create C:\cef-build\depot_tools — automate-git.py downloads depot_tools only when the folder does not exist.
          if ((Test-Path "C:\cef-build\depot_tools") -and -not (Test-Path "C:\cef-build\depot_tools\update_depot_tools.bat")) {
            Remove-Item -Recurse -Force "C:\cef-build\depot_tools"
          }

      - name: Download official CEF automate-git.py
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://bitbucket.org/chromiumembedded/cef/raw/master/tools/automate/automate-git.py" `
            -OutFile "C:\cef-build\automate\automate-git.py"

      - name: Run CEF automated build (win-x64, proprietary_codecs=true)
        shell: cmd
        run: |
          python C:\cef-build\automate\automate-git.py ^
            --download-dir=C:\cef-build\chromium_git ^
            --depot-tools-dir=C:\cef-build\depot_tools ^
            --branch=${{ inputs.cef_branch }} ^
            --checkout=${{ inputs.cef_checkout }} ^
            --x64-build ^
            --no-debug-build ^
            --no-debug-tests ^
            --no-release-tests ^
            --minimal-distrib ^
            --client-distrib ^
            --force-clean

      - name: Stage win-x64 proprietary overlay
        shell: pwsh
        run: |
          $distrib = Get-ChildItem "C:\cef-build\chromium_git\cef\binary_distrib" -Directory -Filter "cef_binary_*_windows64_minimal" | Select-Object -First 1
          if (-not $distrib) { throw "CEF minimal binary distribution not found." }
          $stage = "$env:GITHUB_WORKSPACE\cef-proprietary-win-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$($distrib.FullName)\Release\libcef.dll" $stage -Force
          Copy-Item "$($distrib.FullName)\Release\chrome_elf.dll" $stage -Force
          Copy-Item "$($distrib.FullName)\Release\d3dcompiler_47.dll" $stage -Force
          Copy-Item "$($distrib.FullName)\Release\libEGL.dll" $stage -Force
          Copy-Item "$($distrib.FullName)\Release\libGLESv2.dll" $stage -Force
          Copy-Item "$($distrib.FullName)\Release\vk_swiftshader.dll" $stage -Force
          Copy-Item "$($distrib.FullName)\Release\vulkan-1.dll" $stage -Force
          $ver = (Get-Item "$stage\libcef.dll").VersionInfo.FileVersion
          Write-Host "Built libcef.dll FileVersion: $ver"
          Get-FileHash "$stage\*.dll" -Algorithm SHA256 | Format-Table -AutoSize | Out-File "$stage\SHA256SUMS.txt"

      - name: Upload proprietary CEF win-x64 overlay artifact
        uses: actions/upload-artifact@v4
        with:
          name: cef-proprietary-win-x64-156.0.30
          path: cef-proprietary-win-x64/
          retention-days: 30
