name: Build CEF 156.0.30 Multi-Hop ($0 Free Runner)

on:
  workflow_dispatch:
    inputs:
      cef_branch:
        description: "CEF branch matching pinned CefSharp.Wpf.NETCore 156.0.300"
        required: true
        default: "8078"
      cef_checkout:
        description: "Exact CEF commit matching 156.0.30+g6028375+chromium-156.0.8078.96"
        required: true
        default: "6028375"
      hop_budget_minutes:
        description: "Max compile minutes per hop before handing off via sccache (<=260)"
        required: true
        default: "250"

# Helium-style multi-hop resumable pipeline:
# Each hop compiles for ~4.2h using sccache (GitHub Actions Cache backend) and hands off
# cleanly to the next hop until libcef.dll finishes. Remaining hops are skipped automatically.
# IMPORTANT: Run this on a PUBLIC repository for unlimited $0 Windows runner minutes.
jobs:
  hop_01:
    uses: ./.github/workflows/_cef-hop.yml
    with:
      hop_number: "01"
      cef_branch: ${{ inputs.cef_branch }}
      cef_checkout: ${{ inputs.cef_checkout }}
      hop_budget_minutes: ${{ fromJSON(inputs.hop_budget_minutes) }}

  hop_02:
    needs: [hop_01]
    if: needs.hop_01.result == 'success' && needs.hop_01.outputs.done != 'true'
    uses: ./.github/workflows/_cef-hop.yml
    with:
      hop_number: "02"
      cef_branch: ${{ inputs.cef_branch }}
      cef_checkout: ${{ inputs.cef_checkout }}
      hop_budget_minutes: ${{ fromJSON(inputs.hop_budget_minutes) }}

  hop_03:
    needs: [hop_02]
    if: needs.hop_02.result == 'success' && needs.hop_02.outputs.done != 'true'
    uses: ./.github/workflows/_cef-hop.yml
    with:
      hop_number: "03"
      cef_branch: ${{ inputs.cef_branch }}
      cef_checkout: ${{ inputs.cef_checkout }}
      hop_budget_minutes: ${{ fromJSON(inputs.hop_budget_minutes) }}

  hop_04:
    needs: [hop_03]
    if: needs.hop_03.result == 'success' && needs.hop_03.outputs.done != 'true'
    uses: ./.github/workflows/_cef-hop.yml
    with:
      hop_number: "04"
      cef_branch: ${{ inputs.cef_branch }}
      cef_checkout: ${{ inputs.cef_checkout }}
      hop_budget_minutes: ${{ fromJSON(inputs.hop_budget_minutes) }}

  hop_05:
    needs: [hop_04]
    if: needs.hop_04.result == 'success' && needs.hop_04.outputs.done != 'true'
    uses: ./.github/workflows/_cef-hop.yml
    with:
      hop_number: "05"
      cef_branch: ${{ inputs.cef_branch }}
      cef_checkout: ${{ inputs.cef_checkout }}
      hop_budget_minutes: ${{ fromJSON(inputs.hop_budget_minutes) }}

  hop_06:
    needs: [hop_05]
    if: needs.hop_05.result == 'success' && needs.hop_05.outputs.done != 'true'
    uses: ./.github/workflows/_cef-hop.yml
    with:
      hop_number: "06"
      cef_branch: ${{ inputs.cef_branch }}
      cef_checkout: ${{ inputs.cef_checkout }}
      hop_budget_minutes: ${{ fromJSON(inputs.hop_budget_minutes) }}

  hop_07:
    needs: [hop_06]
    if: needs.hop_06.result == 'success' && needs.hop_06.outputs.done != 'true'
    uses: ./.github/workflows/_cef-hop.yml
    with:
      hop_number: "07"
      cef_branch: ${{ inputs.cef_branch }}
      cef_checkout: ${{ inputs.cef_checkout }}
      hop_budget_minutes: ${{ fromJSON(inputs.hop_budget_minutes) }}

  hop_08:
    needs: [hop_07]
    if: needs.hop_07.result == 'success' && needs.hop_07.outputs.done != 'true'
    uses: ./.github/workflows/_cef-hop.yml
    with:
      hop_number: "08"
      cef_branch: ${{ inputs.cef_branch }}
      cef_checkout: ${{ inputs.cef_checkout }}
      hop_budget_minutes: ${{ fromJSON(inputs.hop_budget_minutes) }}

  hop_09:
    needs: [hop_08]
    if: needs.hop_08.result == 'success' && needs.hop_08.outputs.done != 'true'
    uses: ./.github/workflows/_cef-hop.yml
    with:
      hop_number: "09"
      cef_branch: ${{ inputs.cef_branch }}
      cef_checkout: ${{ inputs.cef_checkout }}
