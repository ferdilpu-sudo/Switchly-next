  hop_10:
    needs: [hop_09]
    if: needs.hop_09.result == 'success' && needs.hop_09.outputs.done != 'true'
    uses: ./.github/workflows/_cef-hop.yml
    with:
      hop_number: "10"
      cef_branch: ${{ inputs.cef_branch }}
      cef_checkout: ${{ inputs.cef_checkout }}
      hop_budget_minutes: ${{ fromJSON(inputs.hop_budget_minutes) }}

  hop_11:
    needs: [hop_10]
    if: needs.hop_10.result == 'success' && needs.hop_10.outputs.done != 'true'
    uses: ./.github/workflows/_cef-hop.yml
    with:
      hop_number: "11"
      cef_branch: ${{ inputs.cef_branch }}
      cef_checkout: ${{ inputs.cef_checkout }}
      hop_budget_minutes: ${{ fromJSON(inputs.hop_budget_minutes) }}

  hop_12:
    needs: [hop_11]
    if: needs.hop_11.result == 'success' && needs.hop_11.outputs.done != 'true'
    uses: ./.github/workflows/_cef-hop.yml
    with:
      hop_number: "12"
      cef_branch: ${{ inputs.cef_branch }}
      cef_checkout: ${{ inputs.cef_checkout }}
      hop_budget_minutes: ${{ fromJSON(inputs.hop_budget_minutes) }}
